
<html>

    <body>
        <h1> Registration </h1>
        <label> Enter ur name </label> <input type="text" name ="xname"><br><br>
        <label> Enter his name </label> <input type="text" name ="aname"><br><br>
        <label> Enter her name </label> <input type="text" name ="yname"><br><br>
        <label> Enter mob name </label> <input type="number" name="mobile"><br><br>
        <label> Enter email id </label> <input type="email" name ="mail"><br><br>
        <label> Enter ur add </label> <textarea name="addresss">    </textarea><br><br>
        <label> Enter ur gender </label> 
        <input type = "radio" name="gender" value="male">male
        <input type = "radio" name="gender" value="female">female

        <label> select ur hobbies   </label>

        <input type="checkbox" name ="hobbies" value="gaming">gaming<br><br>

            <option value="uk">UK</option>
            <option value="australia">Australia</option>
        </select><br><br>
        <label> select ur state </label>

        </select><br><br>
        <label> select ur city </label>
        <select name="city">
            <option value="mumbai">Mumbai</option>

        <label> enter ur password</label>
